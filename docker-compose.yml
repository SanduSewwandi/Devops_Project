version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    image: sandusewwandi/devops_backend:latest
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      # Matches your .env variable names exactly
      MONGODB_URI: "mongodb://mongo:27017/devops"
      CLDN_NAME: "djzjdus1k"
      CLDN_API_KEY: "823756362343243"
      CLDN_API_SECRET: "FwkT9WUwifSXJn-Mev1-2gpvw5c"
      JWT_SECRET: "dummysecret"
      ADMIN_EMAIL: "admin@plant.com"
      ADMIN_PASS: "Admin123"
      
      # Networking & Uploads
      PUBLIC_IP: "${PUBLIC_IP}"
      VITE_API_URL: "http://${PUBLIC_IP}:5000"
      CORS_ORIGIN: "http://localhost:5173,http://${PUBLIC_IP}:5173"
      UPLOAD_PATH: "/app/uploads"
      FILE_UPLOAD_DEST: "/app/uploads"
      NODE_ENV: "production"
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    image: sandusewwandi/devops_frontend:latest
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://${PUBLIC_IP}:5000"
      VITE_API_BASE_URL: "http://${PUBLIC_IP}:5000/api"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data: