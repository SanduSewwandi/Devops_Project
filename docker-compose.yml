version: '3.8'

services:
  frontend:
    image: sandusewwandi/devops_frontend:latest
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      # Vite requires variables to start with VITE_ to be accessible in the browser
      - VITE_API_URL=http://54.234.237.10:5000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: sandusewwandi/devops_backend:latest
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      # Note: No quotes used here. Docker Compose handles these as strings automatically.
      - JWT_SECRET=dummysecret
      - MONGODB_URI=mongodb://mongo:27017/devops
      - NODE_ENV=production
      - CLDN_API_KEY=823756362343243
      - CLDN_API_SECRET=FwkT9WUwifSXJn-Mev1-2gpvw5c
      - CLDN_NAME=djzjdus1k
      - ADMIN_EMAIL=admin@plant.com
      - ADMIN_PASS=Admin123
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: